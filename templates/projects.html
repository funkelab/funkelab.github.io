<div class="projects">
{% for project in projects %}
  <article>
    {% if project.image is defined %}<a href="{{ project.url }}"><img src="{{ project.image }}" alt="{{ project.title }} overview" loading="lazy"></a>{% endif %}
    <h2><a href="{{ project.url }}">{{ project.title }}</a></h2>
    {% if project.description is defined %}<p>{{ project.description }}</p>{% endif %}
  </article>
{% endfor %}
</div>
