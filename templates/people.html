{% for status, label in [('member', 'Current Lab Members'), ('alumni', 'Alumni')] %}
<h2 class="group_title" id="{{ status }}">{{ label }}</h2>
<div class="people">
{% for person in people if person.status == status %}
  <figure class="person">
    {% if person.image is defined %}<img src="{{ person.image }}" alt="{{ person.name }}" loading="lazy">{% endif %}
    <h3 class="name">{{ person.name }}</h3>
    {% if person.role is defined %}<p class="role">{{ person.role }}</p>{% endif %}
    {% if person.links is defined and person.links %}
    <div class="person_links">
      {% for key, label in [('email', 'Email'), ('scholar', 'Google Scholar'), ('github', 'GitHub'), ('orcid', 'ORCID'), ('bluesky', 'Bluesky'), ('website', 'Website')] %}
      {% if person.links.get(key) %}
      <a href="{{ 'mailto:' ~ person.links[key] if key == 'email' else person.links[key] }}" aria-label="{{ person.name }} — {{ label }}" title="{{ label }}">{% include 'icons/' ~ key ~ '.svg' %}</a>
      {% endif %}
      {% endfor %}
    </div>
    {% endif %}
    <div class="person_text">
      {{ person.body }}
    </div>
  </figure>
{% endfor %}
</div>
{% endfor %}
